Normal eligibility rule:
A user needs a CIBIL score of 720 or more
for a standard personal loan.

If CIBIL score is less than 720,
the first condition is FAIL.

Exception rule:
If CIBIL score is only about 30 points less
than the required score (for example 680 to 719),
AND the user has 1 year bank statement,
then the bank can offer the loan with conditions.

If the user does NOT have 1 year bank statement,
then the result is Not Eligible.

If CIBIL score is below 680,

import chromadb

BASE = Path(__file__).resolve().parent.parent
DOCS = BASE / "documents"
DB_DIR = str(BASE / "chroma_db")

def get_embedding_function():
    try:
        from chromadb.utils.embedding_functions import OllamaEmbeddingFunction
        return OllamaEmbeddingFunction(model_name="llama3.2:1b")
    except Exception as e:
        print("Ollama embedding fallback used:", e)
        return None

def main():
    client = chromadb.PersistentClient(path=DB_DIR)
    embedding = get_embedding_function()
    if embedding is None:
        collection = client.get_or_create_collection("unified_docs")
    else:
        collection = client.get_or_create_collection("unified_docs", embedding_function=embedding)
    files = sorted(DOCS.glob("*.txt"))
    total = 0
    for f in files:
        text = f.read_text(encoding="utf-8")
        collection.add(documents=[text], ids=[f.name], metadatas=[{"file": f.name}])
        total += 1
        print("Ingested:", f.name)
    print("TOTAL INGESTED", total)
    return total

if __name__ == "__main__":
